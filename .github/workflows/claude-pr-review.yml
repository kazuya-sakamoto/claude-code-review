name: Claude Code PR Review

on:
  pull_request:
    types: [opened]
    branches: [main]

jobs:
  claude-code-review:
    runs-on: ubuntu-latest
    if: |
      github.actor != 'dependabot[bot]' &&
      github.actor != 'github-actions[bot]'

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.12.2'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic/claude-code@latest

      - name: Get changed files
        id: changed-files
        run: |
          CHANGED_FILES=$(gh pr view ${{ github.event.number }} --json files --jq '.files[].path')
          echo "changed_files<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED_FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Claude Code Review
        id: claude-review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          REVIEW_PROMPT="このPRの変更内容をレビューしてください。以下の観点で分析してください：

          ## セキュリティ
          - SQLインジェクション、XSS、認証バイパスなどの脆弱性
          - 機密情報の適切な取り扱い

          ## コード品質
          - TypeScript型安全性
          - エラーハンドリングの適切性
          - 可読性とメンテナンス性

          ## ベストプラクティス
          - 既存パターンとの一貫性
          - 責務の分離

          重要な問題のみを指摘し、具体的な修正提案を含めてください。"

          claude --print \
            --output-format txt \
            --allowed-tools "Read Grep Glob" \
            --add-dir . \
            "$REVIEW_PROMPT" > claude_review.txt 2>&1

      - name: Post review comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reviewContent = fs.readFileSync('claude_review.txt', 'utf8');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '## 🤖 Claude Code レビュー結果\n\n' +
                    reviewContent + '\n\n' +
                    '---\n' +
                    '*このレビューは Claude Code により自動生成されました*'
            });
