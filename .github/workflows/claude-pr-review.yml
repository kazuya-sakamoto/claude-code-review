name: Claude Code PR Review

on:
  pull_request:
    types: [opened]  # synchronizeを削除してコミット毎の実行を停止
    branches: [main]  # mainブランチのみに制限
  # コメントトリガー: @claude でレビュー依頼
  issue_comment:
    types: [created]
  # 手動実行も可能にする
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR番号'
        required: true
        type: string

jobs:
  claude-code-review:
    runs-on: ubuntu-latest
    # 実行条件: dependabot除外 + コメントトリガーは@claudeを含むPRコメントのみ
    if: |
      github.actor != 'dependabot[bot]' &&
      github.actor != 'github-actions[bot]' &&
      (
        github.event_name == 'pull_request' ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'issue_comment' &&
         github.event.issue.pull_request &&
         contains(github.event.comment.body, '@claude'))
      )

    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      # コメントトリガーの場合、PR情報を取得
      - name: Get PR information (for comment trigger)
        if: github.event_name == 'issue_comment'
        id: pr-info
        uses: actions/github-script@v7
        with:
          script: |
            // 権限チェック: メンバー、オーナー、コラボレーターのみ許可
            const allowedAssociations = ['MEMBER', 'OWNER', 'COLLABORATOR'];
            if (!allowedAssociations.includes(context.payload.comment.author_association)) {
              core.setFailed('Only members can trigger Claude Code review via comments');
              return;
            }

            // PR情報取得
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput('ref', pr.head.ref);
            core.setOutput('sha', pr.head.sha);

            // コメントにリアクションを追加（処理中を示す）
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            });

      # GCP認証（Vertex AI方式の場合のみ）
      - name: Authenticate to Google Cloud
        if: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # コメントトリガーの場合はPRのSHAを使用
          ref: ${{ github.event_name == 'issue_comment' && steps.pr-info.outputs.sha || '' }}
          # PRの完全な差分を取得するため
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.12.2'

      - name: Install Claude Code CLI
        run: |
          npm install -g @anthropic/claude-code@latest

      - name: Get changed files
        id: changed-files
        run: |
          # PRで変更されたファイルのリストを取得
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PR_NUMBER="${{ github.event.inputs.pr_number }}"
          elif [ "${{ github.event_name }}" = "issue_comment" ]; then
            PR_NUMBER="${{ github.event.issue.number }}"
          else
            PR_NUMBER="${{ github.event.number }}"
          fi

          # TypeScript/JavaScript ファイルのみをフィルタリング
          CHANGED_FILES=$(gh pr view ${PR_NUMBER} --json files --jq '.files[].path' | grep -E '\.(ts|tsx|js|jsx)$' | head -20)

          echo "changed_files<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED_FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Claude Code Review
        id: claude-review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Vertex AI用環境変数（GCP Secretsが設定されている場合のみ有効化）
          CLAUDE_CODE_USE_VERTEX: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && '1' || '' }}
          CLOUD_ML_REGION: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && 'us-east5' || '' }}
          ANTHROPIC_VERTEX_PROJECT_ID: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && 'sharefull-claude-code' || '' }}
        run: |
          # 変更されたファイルがある場合のみレビュー実行
          if [ -n "${{ steps.changed-files.outputs.changed_files }}" ]; then
            # プロンプトファイルが存在する場合は使用、なければデフォルト
            if [ -f "docs/CLAUDE_REVIEW.md" ]; then
              REVIEW_PROMPT=$(cat docs/CLAUDE_REVIEW.md)
            else
              REVIEW_PROMPT="このPRの変更内容をレビューしてください。以下の観点で分析してください：

              ## セキュリティ
              - SQLインジェクション、XSS、認証バイパスなどの脆弱性
              - 機密情報の適切な取り扱い
              - APIセキュリティの確認

              ## コード品質
              - TypeScript型安全性
              - エラーハンドリングの適切性
              - パフォーマンスの考慮
              - 可読性とメンテナンス性

              ## ベストプラクティス
              - 既存パターンとの一貫性
              - 責務の分離
              - テスタビリティ

              重要な問題のみを指摘し、具体的な修正提案を含めてください。"
            fi

            # Claude Code実行（JSONフォーマットで出力）
            claude --print \
              --output-format json \
              --allowed-tools "Read Grep Glob" \
              --add-dir . \
              "$REVIEW_PROMPT" > claude_review_raw.json 2>&1

            # JSON形式の確認とフォーマット
            if jq empty claude_review_raw.json 2>/dev/null; then
              jq -r '.content // .response // .' claude_review_raw.json > claude_review.txt
            else
              # JSONでない場合はそのまま使用
              cat claude_review_raw.json > claude_review.txt
            fi

            echo "review_completed=true" >> $GITHUB_OUTPUT
          else
            echo "review_completed=false" >> $GITHUB_OUTPUT
            echo "レビュー対象のファイルが見つかりませんでした。" > claude_review.txt
          fi

      - name: Post review comment
        if: steps.claude-review.outputs.review_completed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reviewContent = fs.readFileSync('claude_review.txt', 'utf8');

            const prNumber = context.payload.pull_request?.number ||
                           context.payload.issue?.number ||
                           context.payload.inputs?.pr_number;

            if (!prNumber) {
              console.log('PR番号が取得できませんでした');
              return;
            }

            // トリガー情報を含める
            const triggerInfo = context.payload.comment
              ? `*トリガー: @${context.actor} によるコメント*`
              : '*トリガー: 自動実行*';

            const commentBody = '## 🤖 Claude Code レビュー結果\n\n' +
              reviewContent + '\n\n' +
              '---\n' +
              '*このレビューは Claude Code により自動生成されました*\n' +
              triggerInfo + '\n' +
              '*重要なセキュリティ問題や設計上の懸念については、必ず人間によるレビューも実施してください*';

            // 既存のClaude Codeコメントを検索
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existingComment = comments.find(comment =>
              comment.user.login === 'github-actions[bot]' &&
              comment.body.includes('Claude Code レビュー結果')
            );

            if (existingComment) {
              // 既存コメントを更新
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: commentBody
              });
            } else {
              // 新しいコメントを作成
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: commentBody
              });
            }

            // コメントトリガーの場合、元のコメントに完了リアクションを追加
            if (context.payload.comment) {
              await github.rest.reactions.createForIssueComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: context.payload.comment.id,
                content: 'rocket'
              });
            }

      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-review-results
          path: |
            claude_review.txt
            claude_review_raw.json
          retention-days: 7
